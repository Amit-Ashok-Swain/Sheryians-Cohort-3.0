<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Squid Game — Watch Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Bungee&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <div class="bg-glow"></div>
    <div class="ghost-side">SQUID</div>
    <div class="ghost-bottom">GAME</div>

    <header class="nav">
      <a class="logo" href="#">
        <span class="logo-line">SQUID</span>
        <span class="logo-line">GAME<i class="dot"></i></span>
      </a>
      <nav class="nav-links">
        <a href="#">About</a>
        <a href="#" class="active">Watch now</a>
        <a href="#">Actors</a>
        <a href="#">Contact</a>
      </nav>
      <button class="burger" aria-label="menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main class="hero">
      <div class="hero-left">
        <h1 class="title">
          <span class="row1">
            <span class="lt">S</span><span class="lt">Q</span><span class="lt with-dot">U<i class="pink-dot"></i></span><span class="lt">I</span><span class="lt">D</span>
            <i class="diamond"></i>
          </span>
          <span class="row2">
            <span class="lt">G</span><span class="lt with-tri">A<i class="pink-tri"></i></span><span class="lt">M</span><span class="lt solid">E</span><i class="bar"></i>
          </span>
          <i class="star"></i>
        </h1>
        <p class="meta">
          Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br/>
          Season 1: 9 Episodes
        </p>
        <div class="cta">
          <button class="btn btn-primary">
            <span class="play"><span class="tri-play"></span></span>
            Play Now
          </button>
          <button class="btn btn-ghost">
            <span class="tri-play sm"></span>
            Watch Trailer
          </button>
        </div>
      </div>

      <div class="hero-center">
        <div class="scroll">
          <span>SCROLL</span>
          <i></i>
        </div>
      </div>

      <div class="hero-right">
        <img src="images/hero.jpg" alt="Masked figure" />
        <div class="socials">
          <a href="#" aria-label="Twitter">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 5.8a8.5 8.5 0 0 1-2.36.65 4.13 4.13 0 0 0 1.81-2.27 8.21 8.21 0 0 1-2.6 1A4.1 4.1 0 0 0 11.85 9a11.65 11.65 0 0 1-8.45-4.29 4.1 4.1 0 0 0 1.27 5.49A4.07 4.07 0 0 1 2.8 9.7v.05a4.11 4.11 0 0 0 3.29 4.03 4.1 4.1 0 0 1-1.85.07 4.11 4.11 0 0 0 3.83 2.85A8.23 8.23 0 0 1 2 18.41 11.61 11.61 0 0 0 8.29 20.25c7.55 0 11.68-6.25 11.68-11.67 0-.18 0-.35-.01-.53A8.32 8.32 0 0 0 22 5.8z"/></svg>
          </a>
          <a href="#" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
          </a>
          <a href="#" aria-label="Facebook">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.5l.5-3h-3V8.6c0-.9.3-1.5 1.6-1.5H17V4.4c-.3 0-1.4-.1-2.6-.1-2.6 0-4.4 1.6-4.4 4.4v2.2H7.5v3H10V21h3.5z"/></svg>
          </a>
        </div>
      </div>
    </main>

    <section class="cards">
      <article class="card">
        <img src="images/card1.jpg" alt="Squid Game"/>
        <div class="card-overlay">
          <div class="card-meta">
            <span class="series">SERIES</span>
            <span class="card-title">SQUID GAME</span>
          </div>
          <button class="play-btn"><span class="tri-play"></span></button>
        </div>
      </article>
      <article class="card">
        <img src="images/card2.jpg" alt="Neon"/>
        <div class="card-overlay">
          <button class="play-btn"><span class="tri-play"></span></button>
        </div>
      </article>
      <article class="card">
        <img src="images/card3.jpg" alt="Trio"/>
        <div class="card-overlay">
          <button class="play-btn"><span class="tri-play"></span></button>
        </div>
      </article>
    </section>
  </div>
</body>
</html>
