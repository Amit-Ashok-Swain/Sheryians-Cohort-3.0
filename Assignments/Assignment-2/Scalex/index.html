<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScaleX — Insights & Blogs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="nav">
      <a href="#" class="brand">
        <img src="logo.png" alt="ScaleX logo" />
      </a>
      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Blogs</a>
        <a href="#">Contact Us</a>
      </nav>
      <a href="#" class="cta">Get Started</a>
    </header>

    <main>
      <h1 class="title">Insights &amp; Blogs</h1>

      <div class="filters">
        <button class="chip active">All</button>
        <button class="chip">Tech</button>
        <button class="chip">SaaS</button>
        <button class="chip">Marketing</button>
      </div>

      <section class="grid">
        <article class="card">
          <div class="card-img"><img src="card1.jpg" alt="Martini glass" /></div>
          <div class="card-body">
            <span class="tag">Tech</span>
            <h3>The Ultimate Guide To SaaS Marketing</h3>
            <p class="date">May 23, 2025</p>
          </div>
        </article>

        <article class="card">
          <div class="card-img"><img src="card2.jpg" alt="Green chair" /></div>
          <div class="card-body">
            <span class="tag">SaaS</span>
            <h3>5 Key Trends In SaaS Growth For 2025</h3>
            <p class="date">May 23, 2025</p>
          </div>
        </article>

        <article class="card">
          <div class="card-img"><img src="card3.jpg" alt="Orange cat" /></div>
          <div class="card-body">
            <span class="tag">Marketing</span>
            <h3>How Data-Driven Strategies Are Important</h3>
            <p class="date">May 23, 2025</p>
          </div>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
