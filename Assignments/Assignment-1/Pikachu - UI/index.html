<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon — Pikachu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <!-- Yellow left panel -->
    <section class="left">
      <img
        class="logo"
        src="logo.png"
        alt="Pokemon logo"
      />

      <div class="content">
        <p class="eyebrow">POKEMON GEN I</p>
        <h1 class="title">Pikachu</h1>
        <p class="desc">
          Pikachu is an Electric-type Pokémon introduced in Generation I.
          Pikachu are small, chubby, and incredibly cute mouse-like Pokémon.
          They are almost completely covered by yellow fur.
        </p>
        <div class="counter">
          <span class="line"></span>
          <span class="count"><strong>01</strong> / 08</span>
        </div>
      </div>

      <!-- Faded pokeball bottom-left -->
      <img
        class="pokeball"
        src="./pokeball.png"
        alt="pokeball"
      />
    </section>

    <!-- Cream right panel -->
    <section class="right">
      <button class="menu" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>

      <ul class="dots">
        <li class="active"></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
    </section>

    <!-- Pikachu image overlapping both panels -->
    <img
      class="pikachu"
      src="./pikachu.png"
      alt="Pikachu"
    />
  </main>
</body>
</html>
