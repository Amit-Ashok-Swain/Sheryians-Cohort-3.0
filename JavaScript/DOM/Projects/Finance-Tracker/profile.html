<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        My Profile | FinTrack Pro

    </title>

<link rel="icon" type="image/png" sizes="192x192" href="./assets/images/logo-icon.png" type="image/png">

<link rel="stylesheet" href="./css/reset.css">
<link rel="stylesheet" href="./css/variables.css">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/dark.css">
<link rel="stylesheet" href="./css/profile.css">

</head>

<body>

<div class="profile-container">

    <div class="profile-card card card-lg">

        <div class="page-actions">

            <button
                id="backToDashboard"
                type="button"
                class="back-button"
            >

                ← Back

            </button>

        </div>

        <div class="profile-header">

            <h1>

                My Profile

            </h1>

            <p>

                Manage your account information

            </p>

        </div>

        <div class="profile-avatar-section">

            <img
                id="profileImage"
                src="./assets/images/default-avatar.png"
                alt="Profile"
            >

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

            <div class="avatar-buttons">

                <button
                    type="button"
                    id="uploadImage">

                    Upload Image

                </button>

                <button
                    type="button"
                    id="removeImage">

                    Remove Image

                </button>

            </div>

        </div>

        <form id="profileForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>

                        First Name

                    </label>

                    <input

                        id="firstName"

                        type="text"

                        readonly

                    >

                </div>

                <div class="form-group">

                    <label>

                        Last Name

                    </label>

                    <input

                        id="lastName"

                        type="text"

                        readonly

                    >

                </div>

                <div class="form-group">

                    <label>

                        Username

                    </label>

                    <input

                        id="username"

                        type="text"

                        readonly

                    >

                </div>

                <div class="form-group">

                    <label>

                        Email

                    </label>

                    <input

                        id="email"

                        type="email"

                        readonly

                    >

                </div>

            </div>

            <div class="account-info">

                <h2>

                    Account Information

                </h2>

                <div class="info-row">

                    <span>

                        Member Since

                    </span>

                    <strong id="createdAt"></strong>

                </div>

                <div class="info-row">

                    <span>

                        Last Login

                    </span>

                    <strong id="lastLogin"></strong>

                </div>

                <div class="info-row">

                    <span>

                        Status

                    </span>

                    <strong id="accountStatus">

                        Active

                    </strong>

                </div>

            </div>

            <div class="profile-actions">

                <button

                    id="editProfile"
                    class="btn btn-primary"
                    type="button"
                >

                    Edit Profile

                </button>

                <button

                    id="saveProfile"

                    type="submit"

                    class="btn btn-success hidden"

                >

                    Save

                </button>

                <button

                    id="cancelProfile"

                    type="button"

                    class="btn btn-danger hidden"

                >

                    Cancel

                </button>

            </div>

        </form>

        <div class="change-password-card">

            <h2>

                Security

            </h2>

            <p>

                Keep your account secure by changing your password regularly.

            </p>

            <button
                id="changePasswordButton"
                type="button"
            >

                🔒 Change Password

            </button>

        </div>

    </div>

</div>

<script src="./js/constants.js"></script>

<script src="./js/storage.js"></script>

<script src="./js/utils/helpers.js"></script>
<script src="./js/utils/validator.js"></script>
<script src="./js/utils/format.js"></script>
<script src="./js/utils/toast.js"></script>

<script src="./js/theme.js"></script>

<script src="./js/auth.js"></script>

<script src="./js/profile.js"></script>

<script src="./js/app.js"></script>

</body>

</html>
