<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Change Password | FinTrack Pro</title>

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./assets/images/logo-icon.png"
      type="image/png"
    />

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/dark.css" />
    <link rel="stylesheet" href="./css/profile.css" />
    <link rel="stylesheet" href="./css/change-password.css" />
  </head>

  <body>
    <div class="profile-container">
      <div class="profile-card card card-lg">
        <div class="page-actions">
          <button id="backToDashboard" type="button" class="back-button">
            ← Back
          </button>
        </div>

        <div class="profile-header">
          <h1>Change Password</h1>

          <p>Update your account password securely.</p>
        </div>

        <form id="changePasswordForm">
          <div class="form-group">
            <label> Current Password </label>

            <div class="password-wrapper">
              <input
                id="currentPassword"
                type="password"
                placeholder="Enter Current Password"
              />

              <button type="button" class="toggle-password">👁</button>
            </div>

            <small class="error" id="currentPasswordError"></small>
          </div>

          <div class="form-group">
            <label> New Password </label>

            <div class="password-wrapper">
              <input
                id="newPassword"
                type="password"
                placeholder="Enter New Password"
              />

              <button type="button" class="toggle-password">👁</button>
            </div>

            <small class="error" id="newPasswordError"></small>
          </div>

          <div class="password-strength">
            <div class="strength-bar">
              <div id="strengthProgress" class="strength-progress"></div>
            </div>

            <small id="strengthText"> Password Strength </small>
          </div>

          <div class="form-group">
            <label> Confirm Password </label>

            <div class="password-wrapper">
              <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm Password"
              />

              <button type="button" class="toggle-password">👁</button>
            </div>

            <small class="error" id="confirmPasswordError"></small>
          </div>

          <div class="profile-actions">
            <button id="cancelPassword" class="btn btn-secondary" type="button">
              Cancel
            </button>

            <button id="savePassword" class="btn btn-primary" type="submit">
              Update Password
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="./js/constants.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/utils/helpers.js"></script>
    <script src="./js/utils/validator.js"></script>
    <script src="./js/utils/toast.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/change-password.js"></script>
  </body>
</html>
