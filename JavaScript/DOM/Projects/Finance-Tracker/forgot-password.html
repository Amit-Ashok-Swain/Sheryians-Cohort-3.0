<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Forgot Password | FinTrack Pro </title>

    <link rel="icon" type="image/png" sizes="192x192" href="./assets/images/logo-icon.png" type="image/png">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/dark.css">
    <link rel="stylesheet" href="./css/auth.css">

</head>

<body>

<main class="auth-container">

    <section class="auth-card">

        <div class="auth-logo">
            <img src="./assets/images/logo-dark.png" alt="Finance Tracker Pro Logo" >
        </div>

        <div class="auth-header">
            <h1>Forgot Password</h1>
            <p>Recover your account securely.</p>
        </div>

        <form id="forgotPasswordForm" novalidate>

            <div class="form-group">
                <label for="identifier">Username or Email</label>
                <input type="text" id="identifier" placeholder="Enter Username or Email" autocomplete="username">
                <small class="error" id="identifierError"></small>
            </div>

            <button type="button" id="findAccount" class="btn btn-primary">Find Account</button>
            <small class="error" id="findAccountError"></small>

            <div id="securitySection" class="hidden">

                <div class="form-group">
                    <label>Security Question</label>
                    <input type="text" id="securityQuestion" readonly>
                </div>

                <div class="form-group">
                    <label>Security Answer</label>
                    <input type="text" id="securityAnswer" autocomplete="off" placeholder="Enter Security Answer">
                    <small class="error" id="securityAnswerError"></small>
                </div>


                <div class="form-group">
                    <label>New Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="newPassword" autocomplete="new-password" placeholder="Enter New Password">
                        <button type="button" class="toggle-password">👁</button>
                    </div>

                    <small class="error"id="newPasswordError"></small>
                </div>

                <div class="password-strength">

                    <div class="strength-bar">

                        <div

                            id="strengthProgress"

                            class="strength-progress"

                        ></div>

                    </div>

                    <small id="strengthText">

                        Password Strength

                    </small>

                </div>

                <div class="form-group">

                    <label>

                        Confirm Password

                    </label>

                    <div class="password-wrapper">

                        <input

                            type="password"

                            id="confirmPassword"

                            autocomplete="new-password"

                            placeholder="Confirm Password"

                        >

                        <button

                            type="button"

                            class="toggle-password"

                        >

                            👁

                        </button>

                    </div>

                    <small
                        class="error"
                        id="confirmPasswordError"
                    ></small>

                </div>

                <button

                    type="submit"

                    id="resetPassword"

                    class="btn btn-primary"

                >

                    Reset Password

                </button>

            </div>

        </form>

        <div class="auth-footer">

            <button
                id="backButton"
                type="button"
                class="back-button"
            >

                ← Back

            </button>

        </div>

    </section>

</main>

<script src="./js/constants.js"></script>
<script src="./js/storage.js"></script>

<script src="./js/utils/helpers.js"></script>
<script src="./js/utils/validator.js"></script>
<script src="./js/utils/toast.js"></script>

<script src="./js/theme.js"></script>

<script src="./js/auth.js"></script>

<script src="./js/forgot-password.js"></script>

</body>

</html>
