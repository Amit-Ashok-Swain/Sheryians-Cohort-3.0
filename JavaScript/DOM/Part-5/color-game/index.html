<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
            <div class="stats">
                <h3 id="timer">Timer - <span id="clock">0</span></h3>
                <h3 id="score">Score - <span id="points">0</span></h3>
            </div>
            <div class="box">
                <!-- <div class="inner-box"></div> -->
            </div>
            <button id="start-btn">Start</button>
            <div class="overlay">
                <h1>Game Over</h1>
                <h3 id="countdown">Game Starting in <span id="countdown-timer">3</span> seconds</h3>
            </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
